name: Test matrix

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (x64) — fork is Windows-first; macOS CI disabled
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          targets: ${{ matrix.target }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: test-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Test wm-common (lib)
        run: cargo test -p wm-common --lib

      - name: Test wm-cli (lib)
        run: cargo test -p wm-cli --lib

      - name: Test wm binary
        run: cargo test -p wm --bin glazewm

      # Integration tests, including the foreign-HWND hang cases.
      # spotcobuild does not support macOS. The skipped tests fail on
      # this branch already and are not part of the hang fix:
      # dispatch_sync cases that see an empty queue after an earlier
      # test posts WM_QUIT. dispatch_sync_with_nested passes alone and
      # fails in this ordered run for the same reason.
      - name: Test wm-platform integration
        run: cargo test -p wm-platform --test test -- --test-threads=1 --skip dispatch_sync_executes_in_order --skip dispatch_sync_from_different_threads --skip dispatch_sync_with_nested

      - name: Check wm and wm-cli
        run: cargo check -p wm -p wm-cli
