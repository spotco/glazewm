general:
  # Commands to run when the WM has started. This is useful for running a
  # script or launching another application.
  # Example: The below command launches Zebar.
  # Launch the spotcobuild bar with the global tiling-direction chip
  startup_commands:
    - 'shell-exec zebar start-widget-preset --pack spotco.tokyo-silence --widget-name bar --preset default'


  # Kill Zebar on WM exit so restart leaves a clean bar process.
  shutdown_commands:
    - 'shell-exec taskkill /IM zebar.exe /F'
  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: false

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': Jump when focus changes between monitors.
    # - 'window_focus': Jump when focus changes between windows.
    trigger: 'monitor_focus'

  # How windows should be hidden when switching workspaces.
  # - 'cloak': (Windows-only) Recommended option for Windows.
  # - 'hide': (Windows-only) Legacy option for Windows. Has stability issues with some apps.
  # - 'place_in_corner': Artifically hides the window by placing it in the corner of the
  #   monitor. On macOS, this is always used instead of cloak/hide.
  hide_method: 'cloak'

  # Affects which windows get shown in the native Windows taskbar. Has no
  # effect if `hide_method: 'hide'`.
  # - 'true': Show all windows (regardless of workspace).
  # - 'false': Only show windows from the currently shown workspaces.
  show_all_in_taskbar: false

gaps:
  # Whether to scale the gaps with the DPI of the monitor.
  scale_with_dpi: true

  # Gap between adjacent windows.
  inner_gap: '0px'

  # Gap between windows and the screen edge.
  # Match Zebar bar height (40px) so windows sit flush under the bar.
  outer_gap:
    top: '0px'
    right: '0px'
    bottom: '0px'
    left: '0px'

window_effects:
  # Visual effects to apply to the focused window.
  focused_window:
    # Bright focus border (Win11 only).
    border:
      enabled: true
      color: '#6cb6ff'

    hide_title_bar:
      enabled: false

    corner_style:
      enabled: false
      style: 'square'

    # Focused window stays fully opaque.
    transparency:
      enabled: false
      opacity: '100%'

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      color: '#3a3a3a'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    # Disabled. A 100% opacity effect is visually a no-op, but applying
    # it still mutates window styles on every focus change.
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  # New windows are created in this state whenever possible.
  # Allowed values: 'tiling', 'floating'.
  initial_state: 'tiling'

  # Sets the default options for when a new window is created. This also
  # changes the defaults for when the state change commands, like
  # `set-floating`, are used without any flags.
  state_defaults:
    floating:
      # Whether to center floating windows by default.
      centered: true

      # Whether to show floating windows as always on top.
      shown_on_top: false

    fullscreen:
      # Maximize the window if possible. If the window doesn't have a
      # maximize button, then it'll be fullscreen'ed normally instead.
      maximized: false

      # Whether to show fullscreen windows as always on top.
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'devenv' }
      - window_process: { equals: 'RobloxStudioBeta' }
      - window_process: { equals: 'RobloxPlayerBeta' }
      - window_process: { equals: 'UmamusumePrettyDerby' }
      - window_process: { equals: 'p4merge' }
      - window_process: { equals: 'ESMP4' }
      - window_process: { equals: 'p4v' }
        window_title: { not_regex: '.*Perforce Helix P4V.*' }
      - window_process: { equals: 'ccollabgui' }
      - window_process: { equals: 'CreationKit' }
      - window_process: { equals: 'PowerToys' }
      
  - commands: ['ignore']
    match:
      # Ignores any Zebar windows.
      - window_process: { equals: 'zebar' }

      # Ignore Final Fantasy XIV.
      - window_process: { equals: 'ffxiv_dx11' }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      
      # Snipping Tool + capture overlay / popups (Win+Shift+S)
      - window_process: { equals: 'SnippingTool' }
      - window_process: { equals: 'ScreenSketch' }
      - window_process: { equals: 'ScreenClippingHost' }
      - window_title: { equals: 'Screen Snipping' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes:
  # When enabled, the focused window can be resized via arrow keys or HJKL.
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      # Press enter/escape to return to default keybindings.
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  # --- Omarchy-style bindings (Mod = Win/Super) ---

  # Mod + H/K/L + arrows — focus (J is Omarchy tiling-direction)
  - commands: ['focus --direction left']
    bindings: ['lwin+h', 'lwin+left']
  - commands: ['focus --direction down']
    bindings: ['lwin+down']
  - commands: ['focus --direction up']
    bindings: ['lwin+k', 'lwin+up']
  - commands: ['focus --direction right']
    bindings: ['lwin+l', 'lwin+right']

  # Mod + Shift + H/K/L + arrows - move window using global stack direction
  - commands: ['move --direction left']
    bindings: ['lwin+shift+h', 'lwin+shift+left']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+k', 'lwin+shift+up']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+l', 'lwin+shift+right']

  # Mod + Shift + Ctrl + H/K/L + arrows - same move with opposite stack axis
  # (does not flip Super+J / global tiling direction)
  - commands: ['move --direction left --opposite-tiling-direction']
    bindings: ['lwin+shift+control+h', 'lwin+shift+control+left']
  - commands: ['move --direction down --opposite-tiling-direction']
    bindings: ['lwin+shift+control+down']
  - commands: ['move --direction up --opposite-tiling-direction']
    bindings: ['lwin+shift+control+k', 'lwin+shift+control+up']
  - commands: ['move --direction right --opposite-tiling-direction']
    bindings: ['lwin+shift+control+l', 'lwin+shift+control+right']

  # Mod + Shift + Z/Y - undo/redo the last structural tiling move
  - commands: ['undo']
    bindings: ['lwin+shift+z']
  - commands: ['redo']
    bindings: ['lwin+shift+y']

  # Mod + F — fullscreen (true fullscreen)
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+f']

  # Mod + Alt + F — full width / maximize (Omarchy Super+Alt+F)
  - commands: ['toggle-fullscreen --maximized=true']
    bindings: ['lwin+alt+f']

  # Mod + T — toggle floating/tiling (Omarchy Super+T)
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+t']

  # Mod + J — toggle global tiling / stack direction (spotcobuild; no wrap)
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+j']

  # Mod + W — close window (Omarchy Super+W)
  - commands: ['close']
    bindings: ['lwin+w']

  # Mod + Enter — terminal (Windows Terminal)
  - commands: ['shell-exec wt']
    bindings: ['lwin+enter']

  # Mod + Space — app launcher (PowerToys Run)
  - commands: ['shell-exec %LOCALAPPDATA%/PowerToys/PowerToys.PowerLauncher.exe']
    bindings: ['lwin+space']

  # Mod + 1..9 — switch workspace
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6']
  - commands: ['focus --workspace 7']
    bindings: ['lwin+7']
  - commands: ['focus --workspace 8']
    bindings: ['lwin+8']
  - commands: ['focus --workspace 9']
    bindings: ['lwin+9']

  # Mod + Shift + 1..9 — move window to workspace (and follow)
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['lwin+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['lwin+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['lwin+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['lwin+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['lwin+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['lwin+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['lwin+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['lwin+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['lwin+shift+9']

  # Alt + Shift + Mod + 1..9 — swap all windows with another workspace
  # (the target workspace becomes focused; an empty target behaves like move)
  - commands: ['move --workspace 1 --all']
    bindings: ['alt+shift+win+1']
  - commands: ['move --workspace 2 --all']
    bindings: ['alt+shift+win+2']
  - commands: ['move --workspace 3 --all']
    bindings: ['alt+shift+win+3']
  - commands: ['move --workspace 4 --all']
    bindings: ['alt+shift+win+4']
  - commands: ['move --workspace 5 --all']
    bindings: ['alt+shift+win+5']
  - commands: ['move --workspace 6 --all']
    bindings: ['alt+shift+win+6']
  - commands: ['move --workspace 7 --all']
    bindings: ['alt+shift+win+7']
  - commands: ['move --workspace 8 --all']
    bindings: ['alt+shift+win+8']
  - commands: ['move --workspace 9 --all']
    bindings: ['alt+shift+win+9']

  # --- Extra utilities (kept, remapped off Omarchy chords) ---

  # Resize: Win + - shrinks, Win + = grows (plus=bigger, minus=smaller)
  # Shift variants adjust height the same way
  - commands: ['resize --width -5%']
    bindings: ['lwin+oem_minus']
  - commands: ['resize --width +5%']
    bindings: ['lwin+oem_plus']
  - commands: ['resize --height -5%']
    bindings: ['lwin+shift+oem_minus']
  - commands: ['resize --height +5%']
    bindings: ['lwin+shift+oem_plus']

  # Optional: enter resize mode (HJKL / arrows), exit with Esc/Enter.
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+r']

  # Pause/resume window management.
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+p']

  # Cycle focus: tiling -> floating -> fullscreen.
  - commands: ['wm-cycle-focus']
    bindings: ['lwin+shift+space']

  # Minimize focused window.
  - commands: ['toggle-minimized']
    bindings: ['lwin+m']

  # Kill GlazeWM process safely (hard chord to avoid accidental exits).
  - commands: ['wm-exit']
    bindings: ['lwin+ctrl+shift+f4']

  # Re-evaluate configuration file.
  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+r']

  # Redraw all windows.
  - commands: ['wm-redraw']
    bindings: ['lwin+shift+w']

  # Mod + Tab / Shift+Tab — next / previous workspace (Omarchy)
  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+tab']
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+shift+tab']

  # Also keep , / . as prev/next workspace
  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+period']
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+comma']

  # Mod + Ctrl + Tab — recent workspace (Omarchy Super+Ctrl+Tab)
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+control+tab']

  # Move the focused window's parent workspace to another monitor.
  - commands: ['move-workspace --direction left']
    bindings: ['lwin+alt+left']
  - commands: ['move-workspace --direction right']
    bindings: ['lwin+alt+right']
  - commands: ['move-workspace --direction up']
    bindings: ['lwin+alt+up']
  - commands: ['move-workspace --direction down']
    bindings: ['lwin+alt+down']
